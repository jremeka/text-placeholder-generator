<!doctype html>
<html>
  <head>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        color: #1c2129;
        font-size: 12px;
        background: #eef1f7;
        position: relative;
        overflow-x: hidden;
        min-height: 100vh;
      }
      .blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(60px);
        z-index: 0;
        pointer-events: none;
      }
      .blob.b1 {
        width: 260px;
        height: 260px;
        background: #8fd3ff;
        opacity: 0.45;
        top: -80px;
        right: -60px;
      }
      .blob.b2 {
        width: 220px;
        height: 220px;
        background: #c7b7f7;
        opacity: 0.4;
        bottom: 40px;
        left: -70px;
      }
      .blob.b3 {
        width: 180px;
        height: 180px;
        background: #a7e8d0;
        opacity: 0.3;
        bottom: -60px;
        right: 20px;
      }

      * {
        position: relative;
        z-index: 1;
      }
      .blob {
        z-index: 0 !important;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 12px;
      }
      .logo-badge {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .logo-badge img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      h2 {
        font-size: 15px;
        margin: 0;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #1c2129;
      }

      button {
        font-family: inherit;
        font-size: 12px;
        border: none;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .glass {
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 18px;
        box-shadow:
          0 4px 24px rgba(31, 41, 55, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
      }

      /* ---- Selection status ---- */
      .selection-pill {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        margin-bottom: 12px;
      }
      .selection-pill .sel-text {
        font-weight: 700;
        font-size: 11.5px;
        color: #1c2129;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .selection-pill .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #b8c0cc;
        flex-shrink: 0;
      }
      .selection-pill.active .dot {
        background: #18a0fb;
        box-shadow: 0 0 6px rgba(24, 160, 251, 0.6);
      }
      .selection-pill.active .sel-text {
        color: #0d8de0;
      }
      .selection-pill.shake {
        animation: shake 0.4s ease;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-4px);
        }
        75% {
          transform: translateX(4px);
        }
      }

      /* ---- Search bar ---- */
      .search-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        margin-bottom: 12px;
      }
      .search-bar input {
        border: none;
        background: transparent;
        outline: none;
        font-size: 12px;
        color: #1c2129;
        flex: 1;
        min-width: 0;
      }
      .search-bar input::placeholder {
        color: #8b93a3;
      }
      .search-icon {
        font-size: 13px;
        opacity: 0.55;
        flex-shrink: 0;
      }
      .search-clear {
        font-size: 13px;
        opacity: 0.5;
        flex-shrink: 0;
      }
      .search-clear:hover {
        opacity: 1;
      }

      /* ---- Tabs ---- */
      .tab-row {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 2px;
        margin-bottom: 12px;
        scrollbar-width: none;
      }
      .tab-row::-webkit-scrollbar {
        display: none;
      }
      .tab-chip {
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.45);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        color: #4b5566;
        font-size: 11px;
        font-weight: 700;
        padding: 7px 13px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .tab-chip.active {
        background: #18a0fb;
        color: white;
        border-color: transparent;
        box-shadow:
          0 3px 10px rgba(24, 160, 251, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }
      .tab-chip:hover:not(.active) {
        background: rgba(255, 255, 255, 0.7);
      }

      /* ---- Category grid ---- */
      .group-block {
        margin-bottom: 16px;
      }
      .group-label {
        font-size: 10.5px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #6b7688;
        margin: 0 0 8px 4px;
      }
      .cat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .cat-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 12px;
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 14px;
        font-size: 11.5px;
        font-weight: 700;
        color: #1c2129;
        box-shadow:
          0 2px 10px rgba(31, 41, 55, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
        text-align: left;
      }
      .cat-btn:hover {
        background: rgba(255, 255, 255, 0.8);
        transform: translateY(-1px);
        box-shadow:
          0 4px 16px rgba(31, 41, 55, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }
      .cat-btn:active {
        transform: translateY(0);
      }
      .cat-icon {
        font-size: 15px;
        flex-shrink: 0;
      }
      .cat-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .more-toggle {
        background: none;
        color: #0d8de0;
        font-size: 11px;
        font-weight: 700;
        padding: 8px 4px;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      /* ---- Undo toast ---- */
      .toast {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        margin-bottom: 12px;
        background: rgba(24, 160, 251, 0.12);
        border: 1px solid rgba(24, 160, 251, 0.3);
      }
      .toast-text {
        font-size: 11px;
        font-weight: 600;
        color: #0d8de0;
      }
      .toast-undo {
        background: #18a0fb;
        color: white;
        padding: 5px 12px;
        font-size: 10.5px;
        font-weight: 700;
        border-radius: 999px;
        flex-shrink: 0;
      }
      .toast-undo:hover {
        background: #0d8de0;
      }

      .empty-note {
        text-align: center;
        color: #8b93a3;
        font-size: 11px;
        padding: 6px 0 14px 0;
      }

      .resize-handle {
        position: fixed;
        right: 2px;
        bottom: 2px;
        width: 16px;
        height: 16px;
        cursor: nwse-resize;
        z-index: 999;
        opacity: 0.4;
      }
      .resize-handle:hover {
        opacity: 0.8;
      }
    </style>
  </head>

      const MIN_W = 340,

      const resizeHandle = document.getElementById("resizeHandle");
      let resizing = false;
      let startX = 0,
        startY = 0,
        startW = 0,
        startH = 0;

      resizeHandle.addEventListener("pointerdown", (e) => {
        resizing = true;
        startX = e.clientX;
        startY = e.clientY;
        startW = window.innerWidth;
        startH = window.innerHeight;
        resizeHandle.setPointerCapture(e.pointerId);
      });
      resizeHandle.addEventListener("pointermove", (e) => {
        if (!resizing) return;
        const newW = Math.min(
          MAX_W,
          Math.max(MIN_W, startW + (e.clientX - startX)),
        );
        const newH = Math.min(
          MAX_H,
          Math.max(MIN_H, startH + (e.clientY - startY)),
        );
        parent.postMessage(
          {
            pluginMessage: {
              type: "resize",
              width: Math.round(newW),
              height: Math.round(newH),
            },
          },
          "*",
        );

        let s = String(n);
        while (s.length < len) s = "0" + s;

          yyyy = date.getFullYear();
        const hh = padDigits(date.getHours(), 2),
          min = padDigits(date.getMinutes(), 2);
        return `${dd}/${mm}/${yyyy} \u2022 ${hh}:${min}`;
      }
      function loremSentence(wordCount) {
        const words = Array.from({ length: wordCount }, () =>
          pick(LOREM_WORDS),
        );
        const s = words.join(" ");
        return s.charAt(0).toUpperCase() + s.slice(1) + ".";
      }

      // ================= GENERATORS =================
      const GENERATORS = {
        accountNumber: () => randomDigits(10),
        iban: () =>
          `GB${randomInt(10, 99)} ${pick(["BARC", "HSBC", "LOYD", "NWBK"])} ${randomDigits(4)} ${randomDigits(4)} ${randomDigits(2)}`,
        cardNumber: () =>
          `${randomInt(4000, 4999)} ${randomDigits(4)} ${randomDigits(4)} ${randomDigits(4)}`,

        cvv: () => randomDigits(3),

          if (type === "eth") return "0x" + randomHex(40);
          if (type === "btc_legacy") return "1" + randomBase58(33);
          return "bc1q" + randomBase58(38).toLowerCase();

        referenceId: () => `REF${randomDigits(8)}`,
        date: () =>

            new Date(

        kycStatus: () =>

        status: () => pick(FIN_STATUSES),

        rating: () => `${(randomInt(10, 50) / 10).toFixed(1)} \u2605`,
        discountCode: () => `SAVE${randomInt(10, 50)}`,

        headline: () => pick(HEADLINES),

          Array.from({ length: 3 }, () => loremSentence(randomInt(8, 14))).join(
            " ",
          ),
        authorName: () => pick(AUTHOR_NAMES),
        articleExcerpt: () => loremSentence(randomInt(16, 24)),
        contentTag: () =>
          pick([
            "Design",
            "Culture",
            "Process",
            "Interview",
            "Essay",
            "Field Notes",
          ]),
        publishDate: () =>
          formatDateTime(new Date(Date.now() - randomInt(0, 300) * 86400000))
            .split("\u2022")[0]
            .trim(),
        readTime: () => pick(READ_TIMES),
        commentCount: () => String(randomInt(0, 240)),
        pullQuote: () => `\u201c${loremSentence(randomInt(6, 10))}\u201d`,
        caption: () => loremSentence(randomInt(4, 8)),

        username: () => pick(HANDLES),
        postCaption: () => pick(POST_CAPTIONS),
        likeCount: () => String(randomInt(3, 12000)),
        comment: () => pick(COMMENTS),
        hashtag: () => pick(HASHTAGS),
        followerCount: () => String(randomInt(50, 480000)),
        shareCount: () => String(randomInt(0, 900)),
        bio: () => pick(BIOS),
        notificationText: () =>
          pick([
            "liked your post",
            "started following you",
            "commented on your photo",
            "mentioned you in a comment",
            "shared your post",
          ]),

        fullName: () => `${pick(FIRST_NAMES)} ${pick(LAST_NAMES)}`,
        firstName: () => pick(FIRST_NAMES),
        lastName: () => pick(LAST_NAMES),
        email: () => {
          const first = pick(FIRST_NAMES).toLowerCase(),
            last = pick(LAST_NAMES).toLowerCase();
          return `${first}.${last}${randomInt(1, 99)}@${pick(["gmail.com", "outlook.com", "proton.me", "yahoo.com"])}`;
        },
        phone: () =>
          `+1 (${randomInt(200, 989)}) ${randomInt(200, 989)}-${padDigits(randomInt(0, 9999), 4)}`,
        address: () => `${randomInt(10, 9999)} ${pick(STREET_NAMES)}`,
        jobTitle: () => pick(JOB_TITLES),
        companyName: () => pick(COMPANIES),
        avatarInitials: () =>
          (pick(FIRST_NAMES)[0] + pick(LAST_NAMES)[0]).toUpperCase(),
        department: () => pick(DEPARTMENTS),
        employeeId: () => `EMP-${randomDigits(5)}`,

        loremSentence: () => loremSentence(randomInt(6, 12)),
        genericLabel: () => pick(GENERIC_LABELS),
        placeholderWord: () => pick(LOREM_WORDS),
        randomNumber: () => String(randomInt(1, 99999)),
        yesNo: () => pick(["Yes", "No"]),
        shortId: () => randomHex(8),
        url: () =>
          `https://example.com/${pick(LOREM_WORDS)}-${randomInt(100, 999)}`,
        fileName: () => `${pick(FILE_NAMES)}.${pick(FILE_EXTENSIONS)}`,

        custom: () => "Sample text",
      };

      // ================= CATEGORIES =================
      const CATEGORIES = [
        { value: "accountNumber", label: "Account Number", icon: "\u{1F3E6}" },

        {

        { value: "sku", label: "SKU", icon: "\u{1F3F7}\uFE0F" },
        { value: "rating", label: "Star Rating", icon: "\u2B50" },
        { value: "discountCode", label: "Discount Code", icon: "\u{1F3AB}" },
        {
          value: "categoryTag",
          label: "Category Tag",
          icon: "\u{1F3F7}\uFE0F",
        },
        { value: "quantity", label: "Quantity", icon: "\u{1F522}" },
        { value: "deliveryDate", label: "Delivery Date", icon: "\u{1F4C5}" },
        { value: "stockLevel", label: "Stock Level", icon: "\u{1F4CA}" },
        { value: "merchantName", label: "Merchant Name", icon: "\u{1F3EA}" },

        { value: "headline", label: "Headline", icon: "\u{1F4F0}" },
        { value: "tagline", label: "Tagline", icon: "\u2728" },
        { value: "loremParagraph", label: "Paragraph", icon: "\u{1F4C4}" },
        { value: "authorName", label: "Author Name", icon: "\u270D\uFE0F" },
        { value: "articleExcerpt", label: "Excerpt", icon: "\u{1F4C4}" },
        { value: "contentTag", label: "Content Tag", icon: "\u{1F3F7}\uFE0F" },
        { value: "publishDate", label: "Publish Date", icon: "\u{1F4C5}" },
        { value: "readTime", label: "Read Time", icon: "\u23F1\uFE0F" },
        { value: "commentCount", label: "Comment Count", icon: "\u{1F4AC}" },
        { value: "pullQuote", label: "Pull Quote", icon: "\u{1F4AC}" },
        { value: "caption", label: "Caption", icon: "\u{1F4DD}" },

        { value: "username", label: "Username", icon: "\u{1F464}" },
        { value: "postCaption", label: "Post Caption", icon: "\u{1F4DD}" },
        { value: "likeCount", label: "Like Count", icon: "\u2764\uFE0F" },
        { value: "comment", label: "Comment", icon: "\u{1F4AC}" },
        { value: "hashtag", label: "Hashtag", icon: "#\uFE0F\u20E3" },
        { value: "followerCount", label: "Follower Count", icon: "\u{1F465}" },
        { value: "shareCount", label: "Share Count", icon: "\u{1F501}" },
        { value: "bio", label: "Bio", icon: "\u{1F4C3}" },
        { value: "notificationText", label: "Notification", icon: "\u{1F514}" },

        { value: "fullName", label: "Full Name", icon: "\u{1F464}" },
        { value: "firstName", label: "First Name", icon: "\u{1F464}" },
        { value: "lastName", label: "Last Name", icon: "\u{1F464}" },
        { value: "email", label: "Email", icon: "\u{1F4E7}" },
        { value: "phone", label: "Phone", icon: "\u{1F4DE}" },
        { value: "address", label: "Address", icon: "\u{1F4CD}" },
        { value: "jobTitle", label: "Job Title", icon: "\u{1F4BC}" },
        { value: "companyName", label: "Company", icon: "\u{1F3E2}" },
        {
          value: "avatarInitials",
          label: "Avatar Initials",
          icon: "\u{1F5BC}\uFE0F",
        },
        { value: "department", label: "Department", icon: "\u{1F465}" },
        { value: "employeeId", label: "Employee ID", icon: "\u{1F194}" },

        { value: "loremSentence", label: "Lorem Sentence", icon: "\u{1F4C4}" },
        { value: "genericLabel", label: "Label", icon: "\u{1F3F7}\uFE0F" },
        { value: "placeholderWord", label: "Word", icon: "\u{1F524}" },
        { value: "randomNumber", label: "Number", icon: "\u{1F522}" },
        { value: "yesNo", label: "Yes / No", icon: "\u2705" },
        { value: "shortId", label: "Short ID", icon: "\u{1F194}" },
        { value: "url", label: "URL", icon: "\u{1F517}" },
        { value: "fileName", label: "File Name", icon: "\u{1F4C1}" },
        { value: "custom", label: "Custom / Other", icon: "\u2728" },
      ];

      // ================= GROUPS =================
      const GROUPS = [
        {
          id: "fintech",
          label: "Fintech",
          icon: "\u{1F4B3}",
          pinned: [
            "currencyAmount",
            "accountNumber",
            "bankName",
            "status",
            "transactionId",
          ],
          categories: [
            "accountNumber",
            "iban",
            "cardNumber",
            "cardExpiry",
            "cvv",
            "cryptoAddress",
            "currencyAmount",
            "balance",
            "percentage",
            "currency",
            "bankName",
            "transactionId",
            "referenceId",
            "date",
            "kycStatus",
            "status",
          ],
        },
        {
          id: "commerce",
          label: "Commerce",
          icon: "\u{1F6CD}\uFE0F",
          pinned: ["productName", "price", "orderId", "shippingStatus"],
          categories: [
            "productName",
            "price",
            "orderId",
            "shippingStatus",
            "sku",
            "rating",
            "discountCode",
            "categoryTag",
            "quantity",
            "deliveryDate",
            "stockLevel",
            "merchantName",
          ],
        },
        {
          id: "content",
          label: "Content",
          icon: "\u{1F4C4}",
          pinned: ["headline", "tagline", "loremParagraph", "authorName"],
          categories: [
            "headline",
            "tagline",
            "loremParagraph",
            "authorName",
            "articleExcerpt",
            "contentTag",
            "publishDate",
            "readTime",
            "commentCount",
            "pullQuote",
            "caption",
          ],
        },
        {
          id: "social",
          label: "Social",
          icon: "\u{1F4AC}",
          pinned: ["username", "postCaption", "likeCount", "hashtag"],
          categories: [
            "username",
            "postCaption",
            "likeCount",
            "comment",
            "hashtag",
            "followerCount",
            "shareCount",
            "bio",
            "notificationText",
          ],
        },
        {
          id: "people",
          label: "People",
          icon: "\u{1F464}",
          pinned: ["fullName", "email", "phone", "jobTitle"],
          categories: [
            "fullName",
            "firstName",
            "lastName",
            "email",
            "phone",
            "address",
            "jobTitle",
            "companyName",
            "avatarInitials",
            "department",
            "employeeId",
          ],
        },
        {
          id: "generic",
          label: "Generic",
          icon: "\u2728",
          pinned: [
            "loremSentence",
            "genericLabel",
            "placeholderWord",
            "randomNumber",
          ],
          categories: [
            "loremSentence",
            "genericLabel",
            "placeholderWord",
            "randomNumber",
            "yesNo",
            "shortId",
            "url",
            "fileName",
            "custom",
          ],
        },
      ];

      function catByValue(v) {
        return CATEGORIES.find((c) => c.value === v);
      }

      // ================= APP STATE =================
      let currentSelection = []; // [{layerId, layerName, originalText}]
      let activeTab = "fintech";
      let moreOpen = false;
      let searchQuery = "";
      let lastFillBatch = null; // { label, items: [{layerId, value}] } for undo

      const selectionPill = document.getElementById("selectionPill");
      const pickerArea = document.getElementById("pickerArea");
      const toastArea = document.getElementById("toastArea");
      const searchInput = document.getElementById("searchInput");
      const searchClear = document.getElementById("searchClear");

      searchInput.addEventListener("input", () => {
        searchQuery = searchInput.value;
        searchClear.style.display = searchQuery ? "" : "none";
        renderPicker();
      });
      searchClear.addEventListener("click", () => {
        searchQuery = "";
        searchInput.value = "";
        searchClear.style.display = "none";
        renderPicker();
        searchInput.focus();
      });

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;

        if (msg.type === "selection-updated") {
          currentSelection = msg.layers;
          renderSelectionPill();
        }

        if (msg.type === "write-complete") {
          if (msg.purpose === "apply") {
            // lastFillBatch already set optimistically before sending; nothing further needed
          } else if (msg.purpose === "undo") {
            toastArea.innerHTML = "";
            lastFillBatch = null;
          }
        }
      };

      function renderSelectionPill() {
        const n = currentSelection.length;
        if (n === 0) {
          selectionPill.className = "selection-pill glass";
          selectionPill.innerHTML = `<span class="sel-text"><span class="dot"></span>No text layers selected</span>`;
        } else {
          selectionPill.className = "selection-pill glass active";
          selectionPill.innerHTML = `<span class="sel-text"><span class="dot"></span>${n} text layer${n === 1 ? "" : "s"} selected</span>`;
        }
      }

      function shakeSelectionPill() {
        selectionPill.classList.remove("shake");
        void selectionPill.offsetWidth;
        selectionPill.classList.add("shake");
      }

      function renderPicker() {
        const existingTabRow = pickerArea.querySelector(".tab-row");
        const savedTabScroll = existingTabRow ? existingTabRow.scrollLeft : 0;

        let html = "";

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const matches = CATEGORIES.filter((c) =>
            c.label.toLowerCase().includes(q),
          );
          html += `<div class="group-block">
          <div class="group-label">Search results</div>
          ${matches.length === 0 ? `<p class="empty-note">No categories match "${escapeHtml(searchQuery)}"</p>` : `<div class="cat-grid">${matches.map(renderCatBtn).join("")}</div>`}
        </div>`;
        } else {
          html += `<div class="tab-row">
          ${GROUPS.map((g) => `<button class="tab-chip ${g.id === activeTab ? "active" : ""}" data-tab="${g.id}">${g.icon} ${escapeHtml(g.label)}</button>`).join("")}
        </div>`;

          const group = GROUPS.find((g) => g.id === activeTab) || GROUPS[0];
          const pinned = group.pinned.map(catByValue).filter(Boolean);
          const rest = group.categories
            .filter((v) => !group.pinned.includes(v))
            .map(catByValue)
            .filter(Boolean);

          html += `<div class="group-block">
          <div class="cat-grid">${pinned.map(renderCatBtn).join("")}</div>
          ${rest.length > 0 ? `<button class="more-toggle" id="moreToggle">${moreOpen ? "Show less" : `More in ${escapeHtml(group.label)} (${rest.length})`}</button>` : ""}
          ${moreOpen ? `<div class="cat-grid" style="margin-top:8px;">${rest.map(renderCatBtn).join("")}</div>` : ""}
        </div>`;
        }

        pickerArea.innerHTML = html;
        attachPickerHandlers();

        const newTabRow = pickerArea.querySelector(".tab-row");
        if (newTabRow) newTabRow.scrollLeft = savedTabScroll;
      }

      function renderCatBtn(c) {
        return `<button class="cat-btn" data-cat="${c.value}"><span class="cat-icon">${c.icon}</span><span class="cat-label">${escapeHtml(c.label)}</span></button>`;
      }

      function attachPickerHandlers() {
        document.querySelectorAll(".tab-chip").forEach((btn) => {
          btn.onclick = () => {
            activeTab = btn.getAttribute("data-tab");
            moreOpen = false;
            renderPicker();
          };
        });

        const moreToggle = document.getElementById("moreToggle");
        if (moreToggle) {
          moreToggle.onclick = () => {
            moreOpen = !moreOpen;
            renderPicker();
          };
        }

        document.querySelectorAll(".cat-btn").forEach((btn) => {
          btn.onclick = () => fillSelection(btn.getAttribute("data-cat"));
        });
      }

      function fillSelection(category) {
        if (currentSelection.length === 0) {
          shakeSelectionPill();
          return;
        }

        const items = currentSelection.map((l) => ({
          layerId: l.layerId,
          value: GENERATORS[category]
            ? GENERATORS[category]()
            : GENERATORS.custom(),
        }));
        const undoItems = currentSelection.map((l) => ({
          layerId: l.layerId,
          value: l.originalText,
        }));
        const label = catByValue(category)
          ? catByValue(category).label
          : category;

        lastFillBatch = { label, undoItems };

        toastArea.innerHTML = `
        <div class="toast glass">
          <span class="toast-text">Filled ${items.length} layer${items.length === 1 ? "" : "s"} with ${escapeHtml(label)}</span>
          <button class="toast-undo" id="toastUndoBtn">Undo</button>
        </div>
      `;
        document.getElementById("toastUndoBtn").onclick = undoLastFill;

        parent.postMessage(
          { pluginMessage: { type: "write", items, purpose: "apply" } },
          "*",
        );
      }

      function undoLastFill() {
        if (!lastFillBatch) return;
        parent.postMessage(
          {
            pluginMessage: {
              type: "write",
              items: lastFillBatch.undoItems,
              purpose: "undo",
            },
          },
          "*",
        );
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      renderSelectionPill();
      renderPicker();
    </script>
